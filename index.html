<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StyleAI - 맞춤형 뷰티/패션 컨설턴트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f5f5f7; color: #1d1d1f; }
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04); }
        .apple-input { background-color: rgba(255,255,255,0.9); border: none; border-radius: 16px; padding: 14px 18px; font-size: 16px; width: 100%; transition: all 0.3s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .apple-input:focus { outline: none; box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.3); }
        .apple-btn { background-color: #007aff; color: white; border-radius: 24px; font-weight: 600; font-size: 17px; padding: 16px 20px; width: 100%; transition: transform 0.1s ease, background-color 0.2s ease; box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3); }
        .apple-btn:active { transform: scale(0.97); background-color: #005bb5; }
        #toast { visibility: hidden; min-width: 250px; background-color: rgba(30, 30, 30, 0.85); color: #fff; text-align: center; border-radius: 24px; padding: 16px 20px; position: fixed; z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%); opacity: 0; transition: opacity 0.4s, bottom 0.4s; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-weight: 500; }
        #toast.show { visibility: visible; opacity: 1; bottom: 60px; }
        .color-swatch { width: 44px; height: 44px; border-radius: 50%; display: inline-block; margin-right: 10px; box-shadow: 0 3px 6px rgba(0,0,0,0.1); border: 2px solid rgba(255,255,255,0.8); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        /* PWA Manifest */
        <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIlN0eWxlQUkiLAogICJzaG9ydF9uYW1lIjogIlN0eWxlQUkiLAogICJzdGFydF91cmwiOiAiLyIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiI2Y1ZjVmNyIsCiAgInRoZW1lX2NvbG9yIjogIiMwMDdhZmYiLAogICJpY29ucyI6IFsKICAgIHsKICAgICAgInNyYyI6ICJodHRwczovL2ltYWdlcy51bnNwbGFzaC5jb20vcGhvdG8tMTQ5MDM2NzUyNDgwMS1iOWFjMzMyMjZhMWU/dz0xOTImcmVjdD0wLDAsNTAwLDUwMCIsCiAgICAgICJzaXplcyI6ICIxOTJ4MTkyIiwKICAgICAgInR5cGUiOiAiaW1hZ2UvcG5nIgogICAgfQogIF0KfQ==">
    </style>
</head>
<body class="p-4 sm:p-8 max-w-md mx-auto">
    
    <div class="flex justify-between items-center mb-8 px-2 mt-4">
        <h1 class="text-3xl font-extrabold tracking-tight" style="color: #1c1c1e;">StyleAI</h1>
        <button onclick="toggleSettings()" class="text-gray-400 hover:text-gray-800 text-2xl transition-colors"><i class="fas fa-cog"></i></button>
    </div>

    <!-- API 설정 영역 -->
    <div id="settingsPanel" class="glass-panel p-7 mb-6 hidden">
        <h2 class="text-xl font-bold mb-2">설정</h2>
        <p class="text-sm text-gray-500 mb-5">Google AI Studio에서 발급받은 API 키를 입력해주세요.</p>
        <input type="password" id="apiKeyInput" class="apple-input mb-5" placeholder="AI API Key 입력">
        <button onclick="saveApiKey()" class="apple-btn">저장하기</button>
    </div>

    <!-- 입력 영역 -->
    <div class="glass-panel p-7 mb-8">
        <div class="mb-8 text-center">
            <label for="imageUpload" class="block cursor-pointer">
                <div id="imagePreview" class="w-36 h-36 mx-auto rounded-full bg-gray-100 flex items-center justify-center overflow-hidden border-4 border-white shadow-md transition-transform active:scale-95">
                    <i class="fas fa-camera text-4xl text-gray-300"></i>
                </div>
                <p class="text-sm font-bold text-blue-500 mt-4">사진 업로드</p>
            </label>
            <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="previewImage(event)">
        </div>

        <div class="grid grid-cols-2 gap-5 mb-6">
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wide">성별</label>
                <select id="gender" class="apple-input text-gray-800"><option>여성</option><option selected>남성</option></select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wide">연령대</label>
                <select id="age" class="apple-input text-gray-800"><option>10대</option><option selected>20대</option><option>30대</option><option>40대 이상</option></select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wide">키 (cm)</label>
                <input type="number" id="height" class="apple-input" placeholder="175">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wide">체중 (kg)</label>
                <input type="number" id="weight" class="apple-input" placeholder="70">
            </div>
        </div>
        <button onclick="analyzeStyle()" id="analyzeBtn" class="apple-btn mt-2">결과 확인하기</button>
    </div>

    <!-- 로딩 애니메이션 -->
    <div id="loadingIndicator" class="hidden text-center py-10">
        <i class="fas fa-circle-notch fa-spin text-5xl text-blue-500 mb-4"></i>
        <p class="text-gray-600 font-bold text-lg">AI가 스타일을 분석 중입니다...</p>
        <p class="text-gray-400 text-sm mt-2">피부톤과 체형을 매칭하고 있어요</p>
    </div>

    <!-- 결과 영역 -->
    <div id="resultArea" class="hidden space-y-6 pb-12">
        <!-- 톤 분석 결과 -->
        <div class="glass-panel p-7">
            <h2 class="text-2xl font-extrabold mb-3" id="resToneTitle">봄 웜톤</h2>
            <p class="text-gray-600 text-sm leading-relaxed mb-5" id="resToneDesc">설명</p>
            <div>
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-3">베스트 컬러</h3>
                <div id="resColors" class="flex flex-wrap gap-1"></div>
            </div>
        </div>

        <!-- 뷰티 팁 -->
        <div class="glass-panel p-7">
            <h2 class="text-xl font-bold mb-4"><i class="fas fa-sparkles text-yellow-400 mr-2"></i>뷰티 & 스킨케어</h2>
            <p class="text-sm text-gray-700 mb-5 leading-relaxed" id="resBeautyTip">뷰티 팁 내용</p>
            <div id="resBeautyLinks" class="space-y-3 mt-2"></div>
        </div>

        <!-- 탭 메뉴 (TPO) -->
        <div class="flex space-x-3 overflow-x-auto pb-4 pt-2 scrollbar-hide px-1" id="tpoTabs">
            <button id="tab-daily" onclick="changeTPO('daily')" class="tpo-tab px-5 py-2.5 rounded-full bg-blue-500 text-white text-sm font-bold whitespace-nowrap shadow-sm transition-colors">데일리</button>
            <button id="tab-office" onclick="changeTPO('office')" class="tpo-tab px-5 py-2.5 rounded-full bg-white text-gray-500 text-sm font-bold whitespace-nowrap shadow-sm transition-colors border border-gray-100">오피스</button>
            <button id="tab-date" onclick="changeTPO('date')" class="tpo-tab px-5 py-2.5 rounded-full bg-white text-gray-500 text-sm font-bold whitespace-nowrap shadow-sm transition-colors border border-gray-100">데이트</button>
            <button id="tab-travel" onclick="changeTPO('travel')" class="tpo-tab px-5 py-2.5 rounded-full bg-white text-gray-500 text-sm font-bold whitespace-nowrap shadow-sm transition-colors border border-gray-100">✈️ 여행</button>
        </div>

        <!-- TPO 상세 결과 -->
        <div class="glass-panel p-7 bg-gradient-to-b from-blue-50/50 to-white">
            <h2 class="text-xl font-bold mb-3 text-gray-800" id="resTpoTitle">데일리 룩북</h2>
            <p class="text-sm text-gray-600 mb-6 leading-relaxed" id="resTpoDesc">상황별 코디 설명</p>
            
            <div class="space-y-3" id="resShoppingLinks">
                <!-- 쇼핑 링크가 여기 생성됨 -->
            </div>
        </div>
    </div>

    <!-- 토스트 메시지 -->
    <div id="toast">알림 메시지</div>

    <script>
        let base64Image = "";
        let currentAnalysis = null;

        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if(savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            } else {
                toggleSettings(); 
            }
        };

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value;
            localStorage.setItem('gemini_api_key', key);
            showToast("API 키가 안전하게 저장되었습니다.");
            toggleSettings();
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const preview = document.getElementById('imagePreview');
                preview.innerHTML = `<img src="${reader.result}" class="w-full h-full object-cover">`;
                base64Image = reader.result.split(',')[1];
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        async function analyzeStyle() {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                showToast("우측 상단 설정(⚙️)에서 API 키를 입력해주세요.");
                toggleSettings();
                return;
            }
            if (!base64Image) {
                showToast("카메라 아이콘을 눌러 사진을 업로드해주세요.");
                return;
            }

            const btn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loadingIndicator');
            const resultArea = document.getElementById('resultArea');

            btn.disabled = true;
            btn.innerText = "분석 중...";
            loading.classList.remove('hidden');
            resultArea.classList.add('hidden');

            const gender = document.getElementById('gender').value;
            const age = document.getElementById('age').value;
            const height = document.getElementById('height').value;
            const weight = document.getElementById('weight').value;

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            const prompt = `
            너는 최고의 패션/뷰티 컨설턴트야. 제공된 인물 사진과 정보를 바탕으로 분석해줘.
            사용자 정보: ${age} ${gender}, 키 ${height}cm, 체중 ${weight}kg.
            
            반드시 아래 JSON 형식으로만 응답해 (마크다운 백틱 금지):
            {
                "personalColor": "퍼스널 컬러(예: 여름 쿨톤 라이트)",
                "colorDesc": "컬러에 대한 상세 설명과 이미지 컨설팅",
                "bestColors": ["#hexcode1", "#hexcode2", "#hexcode3"],
                "beauty": {
                    "skinType": "예상 피부 타입 및 팁",
                    "recommendation": "추천 화장품(파운데이션 호수, 로션 등)",
                    "searchKeyword": "올리브영 검색용 키워드"
                },
                "tpo": {
                    "daily": { "desc": "체형을 보완하는 데일리룩 코디", "keyword": "데일리룩 추천" },
                    "office": { "desc": "깔끔하고 세련된 출근룩 코디", "keyword": "오피스룩 추천" },
                    "date": { "desc": "호감도를 높이는 데이트룩", "keyword": "데이트룩 추천" },
                    "travel": { "desc": "사진이 잘 나오는 여행룩 (낮/밤 분리)", "keyword": "여행룩 추천" }
                }
            }`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                let jsonText = data.candidates[0].content.parts[0].text;
                jsonText = jsonText.replace(/```json/g, "").replace(/```/g, "").trim();
                
                currentAnalysis = JSON.parse(jsonText);
                renderResults();

            } catch (error) {
                console.error(error);
                showToast("분석 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
            } finally {
                btn.disabled = false;
                btn.innerText = "결과 확인하기";
                loading.classList.add('hidden');
            }
        }

        function renderResults() {
            document.getElementById('resultArea').classList.remove('hidden');
            
            document.getElementById('resToneTitle').innerText = currentAnalysis.personalColor;
            document.getElementById('resToneDesc').innerText = currentAnalysis.colorDesc;
            
            const colorContainer = document.getElementById('resColors');
            colorContainer.innerHTML = '';
            currentAnalysis.bestColors.forEach(hex => {
                colorContainer.innerHTML += `<div class="color-swatch" style="background-color: ${hex};"></div>`;
            });

            document.getElementById('resBeautyTip').innerHTML = `
                <strong class="text-gray-900">피부 타입:</strong> ${currentAnalysis.beauty.skinType}<br><br>
                <strong class="text-gray-900">추천 아이템:</strong> ${currentAnalysis.beauty.recommendation}
            `;
            
            const beautyKeyword = encodeURIComponent(currentAnalysis.beauty.searchKeyword);
            const oliveUrl = `https://www.oliveyoung.co.kr/store/search/getSearchMain.do?query=${beautyKeyword}`;
            document.getElementById('resBeautyLinks').innerHTML = `
                <a href="${oliveUrl}" target="_blank" class="flex items-center justify-center w-full py-4 bg-green-50 text-green-700 rounded-2xl font-bold border border-green-100 active:scale-95 transition-transform">
                    <img src="https://image.oliveyoung.co.kr/pc-static-root/image/comm/h1_logo.png" style="height:14px; margin-right:8px;" onerror="this.style.display='none'"> 뷰티 추천템 바로가기
                </a>
            `;

            // 이벤트 타겟 오류 수정 부분
            changeTPO('daily');
        }

        // 아이폰 Safari 에러를 해결하기 위해 event.target 대신 id를 직접 찾도록 수정
        function changeTPO(type) {
            document.querySelectorAll('.tpo-tab').forEach(tab => {
                tab.classList.remove('bg-blue-500', 'text-white');
                tab.classList.add('bg-white', 'text-gray-500', 'border', 'border-gray-100');
            });
            
            const activeTab = document.getElementById('tab-' + type);
            if(activeTab) {
                activeTab.classList.remove('bg-white', 'text-gray-500', 'border', 'border-gray-100');
                activeTab.classList.add('bg-blue-500', 'text-white');
            }

            const tpoData = currentAnalysis.tpo[type];
            const titles = { daily: "데일리 룩", office: "오피스 룩", date: "데이트 룩", travel: "여행 룩" };
            
            document.getElementById('resTpoTitle').innerText = titles[type];
            document.getElementById('resTpoDesc').innerText = tpoData.desc;

            const keyword = encodeURIComponent(tpoData.keyword);
            const gender = document.getElementById('gender').value;
            
            let shopUrl = `https://search.shopping.naver.com/search/all?query=${keyword}`; 
            let shopName = "네이버 쇼핑";

            if(gender === "남성" || type === "daily") {
                shopUrl = `https://www.musinsa.com/search/musinsa/integration?q=${keyword}`;
                shopName = "무신사";
            }

            document.getElementById('resShoppingLinks').innerHTML = `
                <a href="${shopUrl}" target="_blank" class="block w-full py-4 bg-gray-900 text-white text-center rounded-2xl font-bold shadow-md hover:bg-gray-800 active:scale-95 transition-transform">
                    🛍️ ${shopName}에서 스타일 완성하기
                </a>
            `;
        }

        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => {
                    e.waitUntil(caches.open('style-ai-v2').then((cache) => {
                        return cache.addAll(['/']);
                    }));
                });
                self.addEventListener('fetch', (e) => {
                    e.respondWith(caches.match(e.request).then((response) => {
                        return response || fetch(e.request);
                    }));
                });
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }
    </script>
</body>
</html>
