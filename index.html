<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StyleAI - 맞춤형 뷰티/패션 컨설턴트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f5f5f7; color: #1d1d1f; }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05); }
        .apple-input { background-color: #ffffff; border: 1px solid #e5e5ea; border-radius: 18px; padding: 15px 20px; font-size: 16px; width: 100%; transition: all 0.3s ease; box-shadow: inset 0 1px 3px rgba(0,0,0,0.02); }
        .apple-input:focus { outline: none; border-color: #007aff; box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2); }
        .apple-btn { background-color: #007aff; color: white; border-radius: 24px; font-weight: 700; font-size: 17px; padding: 18px 20px; width: 100%; transition: transform 0.1s ease, background-color 0.2s ease; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3); }
        .apple-btn:active { transform: scale(0.96); background-color: #005bb5; }
        .color-swatch { width: 46px; height: 46px; border-radius: 50%; display: inline-block; margin-right: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: 2px solid #fff; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .item-card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #f1f1f1; box-shadow: 0 2px 8px rgba(0,0,0,0.03); transition: transform 0.1s; }
        .item-card:active { transform: scale(0.98); background: #f9f9f9; }
        
        /* PWA Manifest */
        <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIlN0eWxlQUkiLAogICJzaG9ydF9uYW1lIjogIlN0eWxlQUkiLAogICJzdGFydF91cmwiOiAiLyIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiI2Y1ZjVmNyIsCiAgInRoZW1lX2NvbG9yIjogIiMwMDdhZmYiLAogICJpY29ucyI6IFsKICAgIHsKICAgICAgInNyYyI6ICJodHRwczovL2ltYWdlcy51bnNwbGFzaC5jb20vcGhvdG8tMTQ5MDM2NzUyNDgwMS1iOWFjMzMyMjZhMWU/dz0xOTImcmVjdD0wLDAsNTAwLDUwMCIsCiAgICAgICJzaXplcyI6ICIxOTJ4MTkyIiwKICAgICAgInR5cGUiOiAiaW1hZ2UvcG5nIgogICAgfQogIF0KfQ==">
    </style>
</head>
<body class="p-5 max-w-md mx-auto">
    
    <div class="flex justify-between items-center mb-6 px-2 mt-2">
        <h1 class="text-3xl font-extrabold tracking-tight" style="color: #1c1c1e;">StyleAI</h1>
        <!-- 설정 창 제거 (사용자에게 API 노출 안 함) -->
    </div>

    <!-- 입력 영역 -->
    <div class="glass-panel p-8 mb-8">
        <div class="mb-8 text-center">
            <label for="imageUpload" class="block cursor-pointer">
                <div id="imagePreview" class="w-36 h-36 mx-auto rounded-full bg-gray-100 flex items-center justify-center overflow-hidden border-4 border-white shadow-lg transition-transform active:scale-95 relative">
                    <i class="fas fa-camera text-4xl text-gray-300"></i>
                    <div class="absolute bottom-0 w-full bg-black bg-opacity-40 text-white text-xs py-1">사진 변경</div>
                </div>
            </label>
            <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="previewImage(event)">
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">성별</label>
                <select id="gender" class="apple-input"><option>여성</option><option selected>남성</option></select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">연령대</label>
                <select id="age" class="apple-input"><option>10대</option><option selected>20대</option><option>30대</option><option>40대 이상</option></select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">키 (cm)</label>
                <input type="number" id="height" class="apple-input" placeholder="184">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">체중 (kg)</label>
                <input type="number" id="weight" class="apple-input" placeholder="81">
            </div>
        </div>
        <button onclick="analyzeStyle()" id="analyzeBtn" class="apple-btn">내게 딱 맞는 스타일 분석하기</button>
    </div>

    <!-- 로딩 애니메이션 -->
    <div id="loadingIndicator" class="hidden text-center py-12">
        <i class="fas fa-circle-notch fa-spin text-5xl text-blue-500 mb-5"></i>
        <p class="text-gray-800 font-extrabold text-xl">얼굴과 체형을 정밀 분석 중...</p>
        <p class="text-gray-500 text-sm mt-2">피부톤 매칭 및 상황별 맞춤 아이템을 찾고 있습니다</p>
    </div>

    <!-- 결과 영역 -->
    <div id="resultArea" class="hidden space-y-6 pb-12">
        <!-- 톤 분석 -->
        <div class="glass-panel p-8">
            <h2 class="text-2xl font-extrabold mb-3 text-gray-900" id="resToneTitle">퍼스널 컬러</h2>
            <p class="text-gray-700 text-sm leading-relaxed mb-6" id="resToneDesc">설명</p>
            <div>
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-3">당신을 돋보이게 할 베스트 컬러</h3>
                <div id="resColors" class="flex flex-wrap gap-2"></div>
            </div>
        </div>

        <!-- 뷰티/스킨케어 팁 (구체적 아이템) -->
        <div class="glass-panel p-8">
            <h2 class="text-xl font-extrabold mb-4 text-gray-900"><i class="fas fa-magic text-purple-500 mr-2"></i>피부 타입 & 뷰티 추천</h2>
            <div id="resBeautyTip" class="mb-5"></div>
            <div id="resBeautyLinks"></div>
        </div>

        <!-- 상황별 코디 (TPO) 탭 -->
        <div class="flex space-x-3 overflow-x-auto pb-4 pt-2 scrollbar-hide px-1" id="tpoTabs">
            <button id="tab-daily" onclick="changeTPO('daily')" class="tpo-tab px-6 py-3 rounded-full bg-blue-500 text-white text-sm font-bold whitespace-nowrap shadow-md transition-colors">데일리</button>
            <button id="tab-office" onclick="changeTPO('office')" class="tpo-tab px-6 py-3 rounded-full bg-white text-gray-500 text-sm font-bold whitespace-nowrap shadow-sm border border-gray-100 transition-colors">오피스</button>
            <button id="tab-date" onclick="changeTPO('date')" class="tpo-tab px-6 py-3 rounded-full bg-white text-gray-500 text-sm font-bold whitespace-nowrap shadow-sm border border-gray-100 transition-colors">데이트</button>
            <button id="tab-travel" onclick="changeTPO('travel')" class="tpo-tab px-6 py-3 rounded-full bg-white text-gray-500 text-sm font-bold whitespace-nowrap shadow-sm border border-gray-100 transition-colors">✈️ 여행(낮/밤)</button>
        </div>

        <!-- 코디 상세 및 아이템 링크 리스트 -->
        <div class="glass-panel p-8 bg-blue-50/30">
            <h2 class="text-xl font-extrabold mb-2 text-gray-900" id="resTpoTitle">데일리 룩북</h2>
            <div id="resTpoDesc" class="text-sm text-gray-700 mb-6 leading-relaxed bg-white p-4 rounded-xl shadow-sm border border-gray-100"></div>
            
            <h3 class="text-sm font-bold text-gray-800 mb-3"><i class="fas fa-shopping-bag mr-1 text-blue-500"></i> 추천 매칭 아이템 (바로가기)</h3>
            <div id="resShoppingLinks" class="space-y-3">
                <!-- 개별 쇼핑 링크들이 생성되는 곳 -->
            </div>
        </div>
    </div>

    <script>
        // ★★★ 여기에 회원님의 실제 구글 API 키를 따옴표 안에 넣어주세요! ★★★
        const GEMINI_API_KEY = "AQ.Ab8RN6JH1uNitwHFFz_WbzUp1QmgzWRjnBvf2ZyGYCs86ZyyoQ";

        let base64Image = "";
        let currentAnalysis = null;

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const preview = document.getElementById('imagePreview');
                preview.innerHTML = `<img src="${reader.result}" class="w-full h-full object-cover rounded-full border-4 border-white">`;
                base64Image = reader.result.split(',')[1];
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        async function analyzeStyle() {
            if (GEMINI_API_KEY === "여기에_회원님의_API_키를_넣으세요") {
                alert("코드 내부에 API 키가 입력되지 않았습니다. 코드를 수정해주세요.");
                return;
            }
            if (!base64Image) {
                alert("자신의 얼굴이나 전신이 잘 나온 사진을 먼저 업로드해 주세요!");
                return;
            }

            const btn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loadingIndicator');
            const resultArea = document.getElementById('resultArea');

            btn.disabled = true;
            btn.innerText = "컨설팅 진행 중...";
            loading.classList.remove('hidden');
            resultArea.classList.add('hidden');

            const gender = document.getElementById('gender').value;
            const age = document.getElementById('age').value;
            const height = document.getElementById('height').value;
            const weight = document.getElementById('weight').value;

            // ★ 완벽하게 작동하는 최신 안정화 모델
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${GEMINI_API_KEY}`;

            // ★ 디테일을 극대화한 프롬프트 (JSON 구조 세분화)
            const prompt = `너는 대한민국 최상위 퍼스널 컬러 및 패션/뷰티 컨설턴트야. 
            사용자 정보: ${age} ${gender}, 키 ${height}cm, 체중 ${weight}kg. 사진을 정밀 분석해줘.
            
            두루뭉술한 설명은 절대 금지! 반드시 시중에서 판매되는 '구체적인 브랜드명과 정확한 제품명'을 콕 집어서 추천해야 해.
            여행 룩의 경우 '낮의 활동적인 코디'와 '밤의 쌀쌀함을 대비한 코디'를 명확히 구분해서 추천해.

            무조건 아래 JSON 구조와 Key 이름을 똑같이 유지해서 응답해줘:
            {
                "personalColor": "퍼스널 컬러 (예: 가을 웜 딥)",
                "colorDesc": "사진 속 얼굴 톤과 착장을 바탕으로 한 컬러 분석 및 코디 꿀팁 (3문장 이상 상세히)",
                "bestColors": ["#HexCode1", "#HexCode2", "#HexCode3"],
                "beauty": {
                    "skinType": "사진으로 보이는 예상 피부 타입과 관리 팁",
                    "items": [
                        {"name": "구체적인 브랜드 화장품명 1 (예: 롬앤 쥬시래스팅 틴트 피그피그)", "keyword": "올리브영 검색어 1"},
                        {"name": "구체적인 브랜드 화장품명 2 (예: 라운드랩 자작나무 수분크림)", "keyword": "올리브영 검색어 2"}
                    ]
                },
                "tpo": {
                    "daily": { 
                        "desc": "체형을 보완하는 데일리룩 상세 설명", 
                        "items": [
                            {"name": "추천 상의 구체적 제품 (예: 무신사 스탠다드 릴렉스 핏 크루넥 티셔츠)", "keyword": "무신사 스탠다드 릴렉스 티셔츠"},
                            {"name": "추천 하의 구체적 제품", "keyword": "쇼핑 검색어"}
                        ] 
                    },
                    "office": { 
                        "desc": "격식있고 세련된 오피스룩 상세 설명", 
                        "items": [
                            {"name": "추천 셔츠/블라우스 (브랜드 포함)", "keyword": "쇼핑 검색어"},
                            {"name": "추천 슬랙스/치마 (브랜드 포함)", "keyword": "쇼핑 검색어"}
                        ] 
                    },
                    "date": { 
                        "desc": "호감도를 높이는 로맨틱한 데이트룩 상세 설명", 
                        "items": [
                            {"name": "데이트용 추천 원피스 또는 니트 (브랜드 포함)", "keyword": "쇼핑 검색어"},
                            {"name": "어울리는 신발 또는 가방", "keyword": "쇼핑 검색어"}
                        ] 
                    },
                    "travel": { 
                        "desc": "여행 낮 코디(사진 잘 나오는 룩)와 밤 코디(기온차 대비 아우터 등)를 완벽히 구분한 상세 설명", 
                        "items": [
                            {"name": "낮 여행용 편안한 추천 아이템 (브랜드 포함)", "keyword": "쇼핑 검색어"},
                            {"name": "밤 여행용 추천 아우터/가디건 (브랜드 포함)", "keyword": "쇼핑 검색어"}
                        ] 
                    }
                }
            }`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                            ]
                        }],
                        generationConfig: {
                            responseMimeType: "application/json" // AI가 무조건 JSON으로만 대답하게 강제
                        }
                    })
                });

                const data = await response.json();

                if (data.error) {
                    alert("구글 API 오류:\n" + (data.error.message || "통신 문제 발생"));
                    return;
                }

                const jsonText = data.candidates[0].content.parts[0].text;
                currentAnalysis = JSON.parse(jsonText);
                renderResults();

            } catch (error) {
                alert("사진 분석 중 오류가 발생했습니다. 다른 사진으로 시도해보세요.\n상세: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "내게 딱 맞는 스타일 분석하기";
                loading.classList.add('hidden');
            }
        }

        function renderResults() {
            document.getElementById('resultArea').classList.remove('hidden');
            
            // 톤 & 컬러 세팅
            document.getElementById('resToneTitle').innerText = currentAnalysis.personalColor;
            document.getElementById('resToneDesc').innerText = currentAnalysis.colorDesc;
            
            const colorContainer = document.getElementById('resColors');
            colorContainer.innerHTML = '';
            currentAnalysis.bestColors.forEach(hex => {
                colorContainer.innerHTML += `<div class="color-swatch" style="background-color: ${hex};"></div>`;
            });

            // 뷰티 세팅 (아이템별 올리브영 링크 다중 생성)
            document.getElementById('resBeautyTip').innerHTML = `
                <div class="mb-3"><span class="bg-gray-100 text-gray-700 px-3 py-1 rounded-lg text-sm font-bold border border-gray-200">피부 타입 진단</span></div>
                <p class="text-gray-700 text-sm leading-relaxed">${currentAnalysis.beauty.skinType}</p>
            `;
            
            let beautyLinksHTML = '';
            currentAnalysis.beauty.items.forEach(item => {
                const keyword = encodeURIComponent(item.keyword);
                const url = `https://www.oliveyoung.co.kr/store/search/getSearchMain.do?query=${keyword}`;
                beautyLinksHTML += `
                    <a href="${url}" target="_blank" class="item-card flex items-center justify-between block mb-3 cursor-pointer">
                        <div class="pr-3">
                            <p class="text-xs text-purple-600 font-bold mb-1">뷰티 추천템</p>
                            <p class="text-sm font-bold text-gray-900 leading-snug">${item.name}</p>
                        </div>
                        <div class="bg-purple-50 p-3 rounded-full text-purple-600"><i class="fas fa-search"></i></div>
                    </a>
                `;
            });
            document.getElementById('resBeautyLinks').innerHTML = beautyLinksHTML;

            // TPO 기본 탭 데일리로 세팅
            changeTPO('daily'); 
        }

        function changeTPO(type) {
            // 탭 디자인 변경
            document.querySelectorAll('.tpo-tab').forEach(tab => {
                tab.classList.remove('bg-blue-500', 'text-white', 'shadow-md');
                tab.classList.add('bg-white', 'text-gray-500', 'shadow-sm', 'border', 'border-gray-100');
            });
            
            const activeTab = document.getElementById('tab-' + type);
            if(activeTab) {
                activeTab.classList.remove('bg-white', 'text-gray-500', 'shadow-sm', 'border', 'border-gray-100');
                activeTab.classList.add('bg-blue-500', 'text-white', 'shadow-md');
            }

            const tpoData = currentAnalysis.tpo[type];
            const titles = { daily: "데일리 룩 (Daily)", office: "오피스 룩 (Office)", date: "데이트 룩 (Date)", travel: "여행 룩 (Travel 낮/밤)" };
            
            // 설명 세팅
            document.getElementById('resTpoTitle').innerText = titles[type];
            document.getElementById('resTpoDesc').innerText = tpoData.desc;

            // 아이템별 쇼핑 링크 다중 생성
            let shopLinksHTML = '';
            const gender = document.getElementById('gender').value;

            tpoData.items.forEach(item => {
                const keyword = encodeURIComponent(item.keyword);
                let shopUrl = `https://search.shopping.naver.com/search/all?query=${keyword}`; 
                let shopIcon = "fa-shopping-bag";
                let shopColor = "text-green-500";
                let shopBg = "bg-green-50";

                // 남성이거나 데일리룩일 경우 무신사를 최우선으로 연결
                if(gender === "남성" || type === "daily" || type === "travel") {
                    shopUrl = `https://www.musinsa.com/search/musinsa/integration?q=${keyword}`;
                    shopIcon = "fa-tshirt";
                    shopColor = "text-blue-500";
                    shopBg = "bg-blue-50";
                }

                // 쿠팡 검색 옵션이 필요하다면 아래를 활용할 수 있습니다.
                // let coupangUrl = `https://www.coupang.com/np/search?q=${keyword}`;

                shopLinksHTML += `
                    <a href="${shopUrl}" target="_blank" class="item-card flex items-center justify-between block cursor-pointer">
                        <div class="pr-3">
                            <p class="text-xs text-gray-500 font-bold mb-1">상황별 매칭템</p>
                            <p class="text-sm font-bold text-gray-900 leading-snug">${item.name}</p>
                        </div>
                        <div class="${shopBg} p-3 rounded-full ${shopColor}"><i class="fas ${shopIcon}"></i></div>
                    </a>
                `;
            });

            document.getElementById('resShoppingLinks').innerHTML = shopLinksHTML;
        }
        
        // PWA 서비스 워커 (앱 설치 기능 유지)
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => { e.waitUntil(caches.open('style-ai-v4').then((cache) => { return cache.addAll(['/']); })); });
                self.addEventListener('fetch', (e) => { e.respondWith(caches.match(e.request).then((response) => { return response || fetch(e.request); })); });
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }
    </script>
</body>
</html>
