<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StyleAI - 뷰티/패션 컨설턴트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f5f5f7; color: #1d1d1f; }
        /* 애플 스타일 프리미엄 UI */
        .glass-panel { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04); }
        .apple-input { background-color: rgba(255,255,255,0.95); border: none; border-radius: 18px; padding: 15px 20px; font-size: 16px; width: 100%; transition: all 0.3s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .apple-input:focus { outline: none; box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.3); }
        .apple-btn { background-color: #007aff; color: white; border-radius: 24px; font-weight: 700; font-size: 17px; padding: 18px 20px; width: 100%; transition: transform 0.1s ease, background-color 0.2s ease; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3); }
        .apple-btn:active { transform: scale(0.96); background-color: #005bb5; }
        .color-swatch { width: 46px; height: 46px; border-radius: 50%; display: inline-block; margin-right: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: 2px solid #fff; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        /* PWA Manifest */
        <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIlN0eWxlQUkiLAogICJzaG9ydF9uYW1lIjogIlN0eWxlQUkiLAogICJzdGFydF91cmwiOiAiLyIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiI2Y1ZjVmNyIsCiAgInRoZW1lX2NvbG9yIjogIiMwMDdhZmYiLAogICJpY29ucyI6IFsKICAgIHsKICAgICAgInNyYyI6ICJodHRwczovL2ltYWdlcy51bnNwbGFzaC5jb20vcGhvdG8tMTQ5MDM2NzUyNDgwMS1iOWFjMzMyMjZhMWU/dz0xOTImcmVjdD0wLDAsNTAwLDUwMCIsCiAgICAgICJzaXplcyI6ICIxOTJ4MTkyIiwKICAgICAgInR5cGUiOiAiaW1hZ2UvcG5nIgogICAgfQogIF0KfQ==">
    </style>
</head>
<body class="p-5 max-w-md mx-auto">
    
    <div class="flex justify-between items-center mb-8 px-2 mt-2">
        <h1 class="text-3xl font-extrabold tracking-tight" style="color: #1c1c1e;">StyleAI</h1>
        <!-- 설정(톱니바퀴) 버튼을 완전히 삭제했습니다. 일반 사용자는 API를 볼 수 없습니다. -->
    </div>

    <!-- 입력 영역 -->
    <div class="glass-panel p-8 mb-8">
        <div class="mb-8 text-center">
            <label for="imageUpload" class="block cursor-pointer">
                <div id="imagePreview" class="w-36 h-36 mx-auto rounded-full bg-gray-100 flex items-center justify-center overflow-hidden border-4 border-white shadow-lg transition-transform active:scale-95">
                    <i class="fas fa-camera text-4xl text-gray-300"></i>
                </div>
                <p class="text-sm font-bold text-blue-600 mt-4">나의 사진 업로드</p>
            </label>
            <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="previewImage(event)">
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wide">성별</label>
                <select id="gender" class="apple-input"><option>여성</option><option selected>남성</option></select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wide">연령대</label>
                <select id="age" class="apple-input"><option>10대</option><option selected>20대</option><option>30대</option><option>40대 이상</option></select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wide">키 (cm)</label>
                <input type="number" id="height" class="apple-input" placeholder="184">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wide">체중 (kg)</label>
                <input type="number" id="weight" class="apple-input" placeholder="81">
            </div>
        </div>
        <button onclick="analyzeStyle()" id="analyzeBtn" class="apple-btn">AI 컨설팅 시작하기</button>
    </div>

    <!-- 로딩 애니메이션 -->
    <div id="loadingIndicator" class="hidden text-center py-12">
        <i class="fas fa-circle-notch fa-spin text-5xl text-blue-500 mb-5"></i>
        <p class="text-gray-800 font-extrabold text-xl">나만의 스타일을 분석 중입니다...</p>
        <p class="text-gray-500 text-sm mt-2">퍼스널 컬러와 구체적인 브랜드 아이템을 매칭 중입니다</p>
    </div>

    <!-- 결과 영역 -->
    <div id="resultArea" class="hidden space-y-6 pb-12">
        <!-- 톤 분석 -->
        <div class="glass-panel p-8">
            <h2 class="text-2xl font-extrabold mb-3 text-gray-900" id="resToneTitle">봄 웜톤</h2>
            <p class="text-gray-600 text-sm leading-relaxed mb-6" id="resToneDesc">설명</p>
            <div>
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-3">나의 베스트 컬러</h3>
                <div id="resColors" class="flex flex-wrap gap-2"></div>
            </div>
        </div>

        <!-- 뷰티 팁 (구체적 브랜드/제품명) -->
        <div class="glass-panel p-8">
            <h2 class="text-xl font-extrabold mb-4 text-gray-900"><i class="fas fa-sparkles text-yellow-400 mr-2"></i>찰떡 뷰티 아이템</h2>
            <p class="text-sm text-gray-700 mb-6 leading-relaxed" id="resBeautyTip">뷰티 팁 내용</p>
            <div id="resBeautyLinks"></div>
        </div>

        <!-- 상황별 코디 (TPO) 탭 -->
        <div class="flex space-x-3 overflow-x-auto pb-4 pt-2 scrollbar-hide px-1">
            <button id="tab-daily" onclick="changeTPO('daily')" class="tpo-tab px-6 py-3 rounded-full bg-blue-500 text-white text-sm font-bold whitespace-nowrap shadow-md transition-colors">데일리</button>
            <button id="tab-office" onclick="changeTPO('office')" class="tpo-tab px-6 py-3 rounded-full bg-white text-gray-500 text-sm font-bold whitespace-nowrap shadow-sm border border-gray-100 transition-colors">오피스</button>
            <button id="tab-date" onclick="changeTPO('date')" class="tpo-tab px-6 py-3 rounded-full bg-white text-gray-500 text-sm font-bold whitespace-nowrap shadow-sm border border-gray-100 transition-colors">데이트</button>
            <button id="tab-travel" onclick="changeTPO('travel')" class="tpo-tab px-6 py-3 rounded-full bg-white text-gray-500 text-sm font-bold whitespace-nowrap shadow-sm border border-gray-100 transition-colors">✈️ 여행(낮/밤)</button>
        </div>

        <!-- 코디 상세 (구체적 브랜드/제품명) -->
        <div class="glass-panel p-8 bg-gradient-to-b from-blue-50/50 to-white">
            <h2 class="text-xl font-extrabold mb-3 text-gray-900" id="resTpoTitle">데일리 룩북</h2>
            <p class="text-sm text-gray-700 mb-6 leading-relaxed" id="resTpoDesc">상황별 코디 설명</p>
            <div id="resShoppingLinks"></div>
        </div>
    </div>

    <script>
        // ★★★ 여기에 회원님의 실제 구글 API 키를 따옴표 안에 넣어주세요! ★★★
        // 예시: const GEMINI_API_KEY = "AIzaSyB-xxxxxx-xxxxxx";
        const GEMINI_API_KEY = "AQ.Ab8RN6JH1uNitwHFFz_WbzUp1QmgzWRjnBvf2ZyGYCs86ZyyoQ";

        let base64Image = "";
        let currentAnalysis = null;

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const preview = document.getElementById('imagePreview');
                preview.innerHTML = `<img src="${reader.result}" class="w-full h-full object-cover">`;
                base64Image = reader.result.split(',')[1];
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        async function analyzeStyle() {
            if (GEMINI_API_KEY === "여기에_회원님의_API_키를_넣으세요") {
                alert("개발자 설정 오류: 코드 내부에 API 키가 입력되지 않았습니다.");
                return;
            }
            if (!base64Image) {
                alert("자신의 체형이나 얼굴이 잘 나온 사진을 업로드해 주세요!");
                return;
            }

            const btn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loadingIndicator');
            const resultArea = document.getElementById('resultArea');

            btn.disabled = true;
            btn.innerText = "컨설팅 진행 중...";
            loading.classList.remove('hidden');
            resultArea.classList.add('hidden');

            const gender = document.getElementById('gender').value;
            const age = document.getElementById('age').value;
            const height = document.getElementById('height').value;
            const weight = document.getElementById('weight').value;

            // 안정적이고 가장 빠른 1.5-flash 모델 적용
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

            // 프롬프트 강화: 무조건 '구체적인 브랜드와 제품명'을 뽑아내도록 명령
            const prompt = `너는 대한민국 최고의 패션/뷰티 컨설턴트야. 사용자 정보: ${age} ${gender}, 키 ${height}cm, 체중 ${weight}kg.
            제공된 사진과 정보를 분석하여, 두루뭉술한 설명 대신 '실제 시중에서 판매되는 구체적인 유명 브랜드명과 특정 제품명'을 꼭 포함해서 추천해줘.
            반드시 아래 JSON 형식으로만 정확히 대답해:
            {
                "personalColor": "정확한 퍼스널 컬러 (예: 여름 쿨톤 라이트)",
                "colorDesc": "컬러에 대한 상세한 설명과 코디 꿀팁",
                "bestColors": ["#FF0000", "#00FF00", "#0000FF"],
                "beauty": {
                    "skinType": "피부 타입 진단",
                    "recommendation": "구체적인 브랜드 화장품 추천 (예: 남성은 오보이 쿠션 3호, 여성은 롬앤 쥬시래스팅 틴트 피그피그 등 콕 집어서)",
                    "searchKeyword": "올리브영 검색창에 칠 구체적 제품명 1개"
                },
                "tpo": {
                    "daily": { "desc": "구체적인 브랜드 아이템 추천 (예: 무신사 스탠다드 와이드 슬랙스 블랙에 나이키 에어포스)", "keyword": "쇼핑 핵심 검색어" },
                    "office": { "desc": "구체적인 출근룩 브랜드 아이템 추천", "keyword": "쇼핑 핵심 검색어" },
                    "date": { "desc": "데이트용 구체적 아이템 매칭", "keyword": "쇼핑 핵심 검색어" },
                    "travel": { "desc": "여행 낮 코디와 밤(아우터 등) 코디 분리 설명, 구체적 제품 포함", "keyword": "쇼핑 핵심 검색어" }
                }
            }`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                            ]
                        }],
                        generationConfig: {
                            responseMimeType: "application/json" // AI가 무조건 순수 JSON만 뱉도록 강제 (오류 방지)
                        }
                    })
                });

                const data = await response.json();

                if (data.error) {
                    alert("통신 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
                    return;
                }

                const jsonText = data.candidates[0].content.parts[0].text;
                currentAnalysis = JSON.parse(jsonText);
                renderResults();

            } catch (error) {
                alert("결과를 분석하는 도중 문제가 발생했습니다. 사진을 바꿔서 다시 시도해주세요.");
            } finally {
                btn.disabled = false;
                btn.innerText = "AI 컨설팅 시작하기";
                loading.classList.add('hidden');
            }
        }

        function renderResults() {
            document.getElementById('resultArea').classList.remove('hidden');
            
            document.getElementById('resToneTitle').innerText = currentAnalysis.personalColor;
            document.getElementById('resToneDesc').innerText = currentAnalysis.colorDesc;
            
            const colorContainer = document.getElementById('resColors');
            colorContainer.innerHTML = '';
            currentAnalysis.bestColors.forEach(hex => {
                colorContainer.innerHTML += `<div class="color-swatch" style="background-color: ${hex};"></div>`;
            });

            document.getElementById('resBeautyTip').innerHTML = `
                <div class="mb-3"><strong class="text-gray-900 bg-yellow-100 px-2 py-1 rounded">피부 타입 진단</strong></div>
                <div class="mb-4 text-gray-600">${currentAnalysis.beauty.skinType}</div>
                <div class="mb-3"><strong class="text-gray-900 bg-blue-100 px-2 py-1 rounded">전문가 추천 아이템</strong></div>
                <div class="text-blue-700 font-bold">${currentAnalysis.beauty.recommendation}</div>
            `;
            
            const beautyKeyword = encodeURIComponent(currentAnalysis.beauty.searchKeyword);
            const oliveUrl = `https://www.oliveyoung.co.kr/store/search/getSearchMain.do?query=${beautyKeyword}`;
            document.getElementById('resBeautyLinks').innerHTML = `
                <a href="${oliveUrl}" target="_blank" class="flex items-center justify-center w-full py-4 bg-gray-900 text-white rounded-2xl font-bold shadow-md active:scale-95 transition-transform mt-4">
                    🛒 올리브영에서 추천템 바로보기
                </a>
            `;

            changeTPO('daily'); // 기본 탭 열기
        }

        function changeTPO(type) {
            // 탭 디자인 리셋
            document.querySelectorAll('.tpo-tab').forEach(tab => {
                tab.classList.remove('bg-blue-500', 'text-white', 'shadow-md');
                tab.classList.add('bg-white', 'text-gray-500', 'shadow-sm', 'border', 'border-gray-100');
            });
            
            // 선택한 탭 활성화
            const activeTab = document.getElementById('tab-' + type);
            if(activeTab) {
                activeTab.classList.remove('bg-white', 'text-gray-500', 'shadow-sm', 'border', 'border-gray-100');
                activeTab.classList.add('bg-blue-500', 'text-white', 'shadow-md');
            }

            const tpoData = currentAnalysis.tpo[type];
            const titles = { daily: "데일리 룩 추천", office: "오피스 룩 추천", date: "데이트 룩 추천", travel: "여행 코디 추천 (낮/밤)" };
            
            document.getElementById('resTpoTitle').innerText = titles[type];
            // 상세 추천 내용을 돋보이게 렌더링
            document.getElementById('resTpoDesc').innerHTML = `<div class="text-blue-800 font-bold bg-blue-50 p-4 rounded-xl mb-4 border border-blue-100">${tpoData.desc}</div>`;

            const keyword = encodeURIComponent(tpoData.keyword);
            const gender = document.getElementById('gender').value;
            
            let shopUrl = `https://search.shopping.naver.com/search/all?query=${keyword}`; 
            let shopName = "네이버 쇼핑";

            if(gender === "남성" || type === "daily") {
                shopUrl = `https://www.musinsa.com/search/musinsa/integration?q=${keyword}`;
                shopName = "무신사";
            }

            document.getElementById('resShoppingLinks').innerHTML = `
                <a href="${shopUrl}" target="_blank" class="flex items-center justify-center w-full py-4 bg-gray-900 text-white rounded-2xl font-bold shadow-md active:scale-95 transition-transform">
                    🛍️ ${shopName}에서 최저가 구매하기
                </a>
            `;
        }
        
        // PWA 설정 유지
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => { e.waitUntil(caches.open('style-ai-v3').then((cache) => { return cache.addAll(['/']); })); });
                self.addEventListener('fetch', (e) => { e.respondWith(caches.match(e.request).then((response) => { return response || fetch(e.request); })); });
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }
    </script>
</body>
</html>
